name: Release VoxMesh (Windows)

on:
  push:
    tags:
      - 'v*'
      - '!*-apk'
      - '!*apk*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (.exe & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup MSYS2 UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-abseil-cpp

      # WebRTC AEC3 (cancelación de eco) como biblioteca estática. El script vuelve a compilar si
      # cambió abseil o el toolchain (stamp.txt), así que la caché solo ahorra tiempo.
      - name: Cache WebRTC Audio Processing
        uses: actions/cache@v4
        with:
          path: third_party/webrtc-apm/out
          key: webrtc-apm-${{ hashFiles('third_party/webrtc-apm/build.ps1', 'third_party/webrtc-apm/patches/*') }}

      - name: Build WebRTC Audio Processing (static)
        shell: powershell
        run: |
          .\third_party\webrtc-apm\build.ps1 -Ucrt "${{ steps.msys2.outputs.msys2-location }}\ucrt64"

      - name: Compile voxmesh.exe with CGO
        shell: powershell
        run: |
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:CC = "$ucrt\gcc.exe"
          $env:CXX = "$ucrt\g++.exe"
          $env:PKG_CONFIG = "$ucrt\pkg-config.exe"
          $env:Path = "$ucrt;$env:Path"
          $env:CGO_ENABLED = "1"
          if (Test-Path "icon.png") {
              Copy-Item "icon.png" "internal\ui\icon.png" -Force
          }
          if (Test-Path "icon.ico") {
              & windres -i cmd\voxmesh\voxmesh.rc -O coff -F pe-x86-64 -o cmd\voxmesh\voxmesh_windows_amd64.syso
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          go build -trimpath -tags nolibopusfile -ldflags "-s -w -H windowsgui -linkmode external -extldflags -static -X voxmesh/internal/version.Value=$tag" -o dist/voxmesh.exe ./cmd/voxmesh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # El updater compara el exe bajado contra este hash (formato sha256sum, ASCII sin BOM).
          $hash = (Get-FileHash dist/voxmesh.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\dist\voxmesh.exe.sha256", "$hash  voxmesh.exe`n", [System.Text.Encoding]::ASCII)
          Compress-Archive -Path dist/voxmesh.exe -DestinationPath dist/voxmesh-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxmesh-windows
          path: |
            dist/voxmesh.exe
            dist/voxmesh.exe.sha256
            dist/voxmesh-windows-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxmesh-windows
          path: release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/voxmesh.exe
            release-assets/voxmesh.exe.sha256
            release-assets/voxmesh-windows-x64.zip
          name: "VoxMesh ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
